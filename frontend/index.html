<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151e" />

    <!-- Dynamic lang + SEO — inline script runs before React loads -->
    <script>
      (function () {
        var lang = localStorage.getItem('smart-myslowice-lang');
        if (lang !== 'pl' && lang !== 'en') {
          lang = navigator.language.startsWith('pl') ? 'pl' : 'en';
        }
        document.documentElement.lang = lang;

        // Update meta tags for SEO
        var isEn = lang === 'en';
        var desc = isEn
          ? 'Smart Mysłowice – intelligent city portal. Check weather, air quality, public transport and AED locations in Mysłowice.'
          : 'Smart Mysłowice – inteligentny portal miejski. Sprawdź pogodę, jakość powietrza, komunikację miejską i lokalizacje AED w Mysłowicach.';
        var title = isEn ? 'Smart Mysłowice – intelligent city portal' : 'Smart Mysłowice – inteligentny portal miejski';
        var ogDesc = isEn
          ? 'Weather, air quality, public transport and AED in one place.'
          : 'Pogoda, jakość powietrza, komunikacja miejska i AED w jednym miejscu.';

        document.querySelector('meta[name="description"]')?.setAttribute('content', desc);
        document.querySelector('meta[property="og:title"]')?.setAttribute('content', title);
        document.querySelector('meta[property="og:description"]')?.setAttribute('content', ogDesc);
        document.querySelector('meta[property="og:locale"]')?.setAttribute('content', isEn ? 'en_US' : 'pl_PL');
        document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', title);
        document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', ogDesc);
        document.title = 'Smart Mysłowice';
      })();
    </script>

    <!-- Primary SEO -->
    <meta name="description" content="Smart Mysłowice – inteligentny portal miejski. Sprawdź pogodę, jakość powietrza, komunikację miejską i lokalizacje AED w Mysłowicach." />
    <meta name="keywords" content="Mysłowice, pogoda Mysłowice, jakość powietrza Mysłowice, komunikacja miejska Mysłowice, AED Mysłowice, smart city" />
    <meta name="author" content="Krzysztof Zelman" />
    <link rel="canonical" href="https://smart-myslowice.pl/" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smart-myslowice.pl/" />
    <meta property="og:title" content="Smart Mysłowice – inteligentny portal miejski" />
    <meta property="og:description" content="Pogoda, jakość powietrza, komunikacja miejska i AED w jednym miejscu." />
    <meta property="og:image" content="https://smart-myslowice.pl/og-image.png" />
    <meta property="og:locale" content="pl_PL" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Mysłowice – inteligentny portal miejski" />
    <meta name="twitter:description" content="Pogoda, jakość powietrza, komunikacja miejska i AED w jednym miejscu." />
    <meta name="twitter:image" content="https://smart-myslowice.pl/og-image.png" />

    <!-- hreflang for SEO -->
    <link rel="alternate" href="https://smart-myslowice.pl/" hreflang="pl" />
    <link rel="alternate" href="https://smart-myslowice.pl/" hreflang="en" />
    <link rel="alternate" href="https://smart-myslowice.pl/" hreflang="x-default" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="HRce9jeYQwIESwzNeP4NI6XJAxbhOhEylYfhPmQkIl8" />

    <title>Smart Mysłowice</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
